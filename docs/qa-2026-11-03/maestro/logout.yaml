appId: com.judeu.app
---
- launchApp
- runFlow:
    when:
      notVisible: "Quero contratar"
    commands:
      - tapOn:
          point: "9%,10%"
      - extendedWaitUntil:
          visible: "Sair da conta"
          timeout: 15000
      - takeScreenshot: shots/logout-profile
      - tapOn: "Sair da conta"
- extendedWaitUntil:
    visible: "Quero contratar"
    timeout: 20000
- takeScreenshot: shots/logout-onboarding
