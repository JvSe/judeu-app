name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Valores fake só pra satisfazer a validação de env (@judeu/env) na hora de
      # importar os módulos — os testes são unitários e não abrem conexão real
      # com o banco. Segredos de verdade (Stripe, Supabase, JWT de produção)
      # continuam só no .env local/Railway, nunca aqui.
      DATABASE_URL: "postgresql://test:test@localhost:5432/test"
      CORS_ORIGIN: "http://localhost:3000"
      JWT_ACCESS_SECRET: "ci-only-fake-access-secret-000000"
      JWT_REFRESH_SECRET: "ci-only-fake-refresh-secret-000000"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check-types

      - name: Test
        run: pnpm test
